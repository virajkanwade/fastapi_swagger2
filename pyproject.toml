[build-system]
requires = ["uv_build>=0.9.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "fastapi_swagger2"
version = "0.4.4"
description = "Swagger2 support for FastAPI framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Viraj Kanwade", email = "virajk.oib@gmail.com" },
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.140.7",
]

[project.urls]
Homepage = "https://github.com/virajkanwade/fastapi_swagger2"
Documentation = "https://github.com/virajkanwade/fastapi_swagger2"

[project.optional-dependencies]
test = [
    "pytest >=9.0.0",
    "coverage[toml] >= 6.0, < 8.0",
    "ty",
    "ruff ==0.15.17",
    "httpx >=0.28.1",
]
dev = [
    "ruff ==0.15.17",
]
all = [
    "httpx >=0.28.1",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[dependency-groups]
dev = [
    "nox>=2025.11.12",
]
